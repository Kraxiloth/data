name: Update Sorcery price data

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Update price data
        shell: powershell
        run: powershell.exe -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\update-prices.ps1"

      - name: Update price history
        run: python scripts/update-price-history.py

      - name: Commit changes
        shell: powershell
        run: |
          git config user.name "sorcery-data-bot"
          git config user.email "sorcery-data-bot@users.noreply.github.com"

          git add prices.json prices-history

          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update Sorcery price data"
            git push
          } else {
            Write-Host "Nothing changed."
          fi
